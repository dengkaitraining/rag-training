<!DOCTYPE html>

<html>

<head>

<meta charset="utf-8">

<title>Chunk 查詢</title>

</head>

<body>

<h2>MariaDB 查詢</h2>

<p>
請勾選要查詢的欄位，再輸入查詢值。
</p>

<form method="post" action="/query">

<table border="1">

<tr>

<th>選擇</th>

<th>欄位</th>

<th>查詢值</th>

</tr>

<tr>

<td>

<input type="checkbox"
name="field"
value="id">

</td>

<td>id</td>

<td>

<input
type="text"
name="id_value">

</td>

</tr>

<tr>

<td>

<input
type="checkbox"
name="field"
value="keyword">

</td>

<td>keyword</td>

<td>

<input
type="text"
name="keyword_value">

</td>

</tr>

<tr>

<td>

<input
type="checkbox"
name="field"
value="content">

</td>

<td>content</td>

<td>

<input
type="text"
name="content_value">

</td>

</tr>

</table>

<br>

<input type="submit" value="開始查詢">

</form>

</body>

</html>
