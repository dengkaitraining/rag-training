<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Output Page</title>

    <!-- Linking CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🤖 LLM 回應結果</h1>

    <div class="section">

        <h2>📝 User Prompt</h2>

        <div class="prompt-box">
            {{ user_prompt }}
        </div>

    </div>

    <div class="section">

        <h2>💬 LLM 的回答</h2>

        <div class="answer-box">
            {{ result | safe }}
        </div>

    </div>

    <div class="button-area">
        <a class="btn" href="/">⬅ 回到表單頁面</a>
    </div>

</div>

</body>
</html>
