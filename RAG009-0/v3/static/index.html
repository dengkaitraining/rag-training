<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Flask Form Example</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#eef4fb;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:500px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }

        h1{
            color:#2c3e50;
            text-align:center;
            margin-bottom:30px;
        }

        label{
            display:block;
            font-weight:bold;
            margin-bottom:10px;
            color:#444;
        }

        input[type=text]{
            width:100%;
            padding:12px;
            border:1px solid #bbb;
            border-radius:8px;
            font-size:16px;
            margin-bottom:25px;
            transition:.3s;
        }

        input[type=text]:focus{
            outline:none;
            border-color:#3498db;
            box-shadow:0 0 8px rgba(52,152,219,.3);
        }

        button{
            width:100%;
            padding:13px;
            background:#3498db;
            color:white;
            font-size:17px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#2980b9;
        }

        .footer{
            margin-top:20px;
            text-align:center;
            color:#888;
            font-size:13px;
        }
    </style>

</head>

<body>

<div class="container">

    <h1>Flask Form 範例</h1>

    <form action="/process" method="POST">

        <label for="user_prompt">
            請輸入 User Prompt
        </label>

        <input
            type="text"
            id="user_prompt"
            name="user_prompt"
            placeholder="請輸入想詢問 LLM 的內容..."
        >

        <button type="submit">
            🚀 送出
        </button>

    </form>

    <div class="footer">
        Python Flask Web Application
    </div>

</div>

</body>
</html>
